<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Graphitti — Live Graph</title>
  <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b0e14;
      color: #e6e6e6;
    }

    #bar {
      padding: 10px 16px;
      background: #11151f;
      border-bottom: 1px solid #232838;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #bar button {
      background: #232838;
      color: #e6e6e6;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    #network {
      width: 100vw;
      height: calc(100vh - 46px);
    }

    .legend {
      font-size: 12px;
      opacity: 0.7;
    }

    .contested-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e04c4c;
      border-radius: 50%;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div id="bar">
    <strong>Graphitti</strong>
    <button onclick="loadGraph()">Refresh</button>
    <span class="legend"><span class="contested-dot"></span>contested edge</span>
    <span id="source" class="legend"></span>
    <span id="stats" class="legend"></span>
  </div>
  <div id="network"></div>
  <script>
    let network = null;

    async function loadGraph() {
      try {
        const res = await fetch('/graph');
        if (!res.ok) {
          throw new Error(`Failed to fetch graph data: ${res.status}`);
        }
        const data = await res.json();
        
        const nodesList = data.nodes || [];
        const edgesList = data.edges || [];

        const nodes = new vis.DataSet(nodesList.map(n => ({
          id: n.id, label: n.id, color: '#4c7fe0',
        })));
        const edges = new vis.DataSet(edgesList.map((e, i) => ({
          id: i, from: e.source, to: e.target, label: e.predicate,
          color: e.contested ? '#e04c4c' : '#6b7280',
          font: { size: 10, color: '#9aa4b2' },
        })));

        const container = document.getElementById('network');
        if (network) {
          network.destroy();
        }
        
        network = new vis.Network(container, { nodes, edges }, {
          physics: {
            stabilization: { iterations: 150 },
            barnesHut: { gravitationalConstant: -3000 },
          },
          edges: { arrows: 'to', smooth: { type: 'dynamic' } },
          nodes: { shape: 'dot', size: 14 },
        });
        
        network.once('stabilizationIterationsDone', () => network.setOptions({ physics: false }));

        document.getElementById('stats').textContent =
          `${nodesList.length} entities, ${edgesList.length} relations`;
        document.getElementById('source').textContent =
          data.source_url ? `source: ${data.source_url}` : 'no graph ingested yet';
      } catch (err) {
        console.error('Error loading graph:', err);
        document.getElementById('stats').textContent = 'Error loading graph';
      }
    }
    loadGraph();
  </script>
</body>

</html>
